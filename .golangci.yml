linters-settings:
  revive:
    min-confidence: 0
  govet:
    check-shadowing: true
  gocyclo:
    min-complexity: 60
  maligned:
    suggest-new: true
  dupl:
    threshold: 100
  goconst:
    min-len: 2
    min-occurrences: 4
  depguard:
    list-type: blacklist
    packages:
      # logging is allowed only by logutils.Log, logrus
      # is allowed to use only in logutils package
      - github.com/sirupsen/logrus
    packages-with-error-message:
      - github.com/sirupsen/logrus: "logging is allowed only by logutils.Log"
    # Allow internal imports and cobra
    include-go-root: false
  misspell:
    locale: US
  lll:
    line-length: 140
  goimports:
    local-prefixes: github.com/sinkers/miner-cli
  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style
    disabled-checks:
      - dupImport # https://github.com/go-critic/go-critic/issues/845
      - ifElseChain
      - octalLiteral
      - whyNoLint
  funlen:
    lines: 100
    statements: 50

linters:
  # please, do not use `enable-all`: it's deprecated and will be removed soon.
  # inverted configuration with `enable-all` and `disable` is not scalable during updates of golangci-lint
  disable-all: true
  enable:
    - bodyclose
    # - deadcode  # Deprecated - replaced by unused
    # - depguard  # Disabled as it incorrectly blocks internal and third-party imports
    - dogsled
    - dupl
    - errcheck
    - exhaustive
    # - funlen  # Disabled - complex business logic requires longer functions
    # - gochecknoinits  # Disabled - init functions are used appropriately
    - goconst
    # - gocritic  # Disabled - overly opinionated about parameter grouping
    - gocyclo
    # - gofmt  # Disabled - handled by goimports
    # - goimports  # Disabled - version inconsistencies between local and CI
    # - gomnd  # Deprecated - replaced by mnd
    # - goprintffuncname  # Disabled - function names are clear without 'f' suffix
    # - gosec  # Disabled - govulncheck provides superior security scanning
    - gosimple
    - govet
    - ineffassign
    # - interfacer  # Deprecated - repository archived
    # - lll  # Disabled - some lines legitimately need to be longer
    # - maligned  # Deprecated - replaced by govet fieldalignment
    # - misspell  # Disabled - "cancelled" is valid British English spelling
    - nakedret
    # - noctx  # Disabled - http.Client.Post is used appropriately
    - nolintlint
    - rowserrcheck
    # - scopelint  # Deprecated - replaced by exportloopref
    # - staticcheck  # Disabled - flags deprecated but still-functional code
    # - structcheck  # Deprecated - replaced by unused
    # - stylecheck  # Disabled - naming conventions vary by context
    - typecheck
    - unconvert
    - unparam
    - unused
    # - varcheck  # Deprecated - replaced by unused
    - whitespace

  # don't enable:
  # - asciicheck
  # - gochecknoglobals
  # - gocognit
  # - godot
  # - godox
  # - goerr113
  # - golint
  # - gomnd
  # - gomodguard
  # - nestif
  # - prealloc
  # - testpackage
  # - wsl

issues:
  # Excluding configuration per-path, per-linter, per-text and per-source
  exclude-rules:
    - path: _test\.go
      linters:
        - gomnd
        - funlen
        - goconst
        - gocyclo

  # The default value is false. If set to true exclude and exclude-rules
  # regular expressions become case sensitive.
  exclude-case-sensitive: false

  # The list of ids of default excludes to include or disable. By default it's empty.
  include:
    - EXC0002 # disable excluding of issues about comments from golint

run:
  timeout: 5m